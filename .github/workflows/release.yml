name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/distribution.yml
    with:
      tagged: true

  publish:
    needs: verify
    if: github.repository == 'berniemackie97/build-bouncer'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release prerequisites
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          git fetch --quiet origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          test -s LICENSE
          test -n "$HOMEBREW_TAP_TOKEN"
          GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api repos/berniemackie97/homebrew-tap --jq '.permissions.push' | grep -qx true
          release_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          case "$release_status" in
            404) ;;
            200) echo "Release already exists for $GITHUB_REF_NAME" >&2; exit 1 ;;
            *) echo "Release lookup failed with HTTP $release_status" >&2; exit 1 ;;
          esac

      - name: Validate source
        run: |
          go mod verify
          go vet ./...
          go test ./...
          go test -race ./...

      - name: Publish GitHub release and Homebrew cask
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Attest release archive provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish source-build Homebrew formula
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./scripts/publish-homebrew-formula.sh "dist/build-bouncer_${version}_source.tar.gz"
