name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'berniemackie97/build-bouncer'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release prerequisites
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          git fetch --quiet origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          test -s LICENSE
          node -e 'const p=require("./npm/package.json"); if (!p.license || p.license === "UNLICENSED") process.exit(1)'
          test -n "$HOMEBREW_TAP_TOKEN"
          GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api repos/berniemackie97/homebrew-tap --jq .full_name

      - name: Validate source
        run: |
          go mod verify
          go vet ./...
          go test ./...
          go test -race ./...

      - name: Publish release and Homebrew cask
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Stage and validate npm package
        run: |
          node scripts/stage-npm.mjs dist
          node npm/bin/build-bouncer.cjs --version
          npm pack --dry-run --json --prefix npm > /tmp/build-bouncer-npm-pack.json
          node scripts/verify-npm-pack.mjs /tmp/build-bouncer-npm-pack.json
          node --test scripts/launcher.test.mjs

      - name: Publish npm package
        run: npm publish --access public --provenance --prefix npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
