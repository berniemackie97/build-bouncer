name: Distribution

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: snapshot-only

      - name: Upload native release archives
        uses: actions/upload-artifact@v7
        with:
          name: native-archives
          path: dist/
          if-no-files-found: error
          retention-days: 7

  install-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download native release archives
        uses: actions/download-artifact@v7
        with:
          name: native-archives
          path: dist

      - name: Verify and execute installed binary
        shell: pwsh
        run: ./scripts/smoke-release.ps1 -DistDir dist
