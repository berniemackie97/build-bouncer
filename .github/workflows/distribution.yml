name: Distribution

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      tagged:
        description: Build the exact tag without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/master') }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archives without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: ${{ inputs.tagged && 'release --skip=publish --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload native release archives
        uses: actions/upload-artifact@v7
        with:
          name: native-archives
          path: dist/
          if-no-files-found: error
          retention-days: 7

  install-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download native release archives
        uses: actions/download-artifact@v7
        with:
          name: native-archives
          path: dist

      - name: Verify and execute installed binary
        shell: pwsh
        run: ./scripts/smoke-release.ps1 -DistDir dist

  homebrew-formula-smoke:
    needs: package
    runs-on: macos-latest
    steps:
      - name: Checkout formula tools
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release archives
        uses: actions/download-artifact@v7
        with:
          name: native-archives
          path: dist

      - name: Build and test through Homebrew
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/build-bouncer_*_source.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one source archive" >&2
            exit 1
          fi
          archive="${archives[0]}"
          source_url="file://$(pwd)/$archive"
          tap="berniemackie97/build-bouncer-ci"
          brew tap-new "$tap"
          formula="$(brew --repository "$tap")/Formula/build-bouncer.rb"
          ./scripts/render-homebrew-formula.sh "0.0.0" "$GITHUB_SHA" "$archive" "$source_url" "$formula"
          ruby -c "$formula"
          brew install --formula "$tap/build-bouncer"
          brew test "$tap/build-bouncer"
          test "$("$(brew --prefix)/bin/build-bouncer" --version)" = "build-bouncer v0.0.0 ($GITHUB_SHA)"

  tag-rehearsal:
    if: ${{ !inputs.tagged }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Create unpushed rehearsal tag
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name="BuildBouncer CI" -c user.email="build-bouncer-ci@users.noreply.github.com" \
            tag -a "v0.0.0-ci.${GITHUB_RUN_ID}" -m "Release rehearsal"

      - name: Build tagged release without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --skip=publish --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify tagged archive contents
        shell: pwsh
        run: ./scripts/smoke-release.ps1 -DistDir dist
