name: Distribution

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: snapshot-only

      - name: Validate npm distribution
        run: |
          node scripts/stage-npm.mjs dist
          node npm/bin/build-bouncer.cjs --version
          npm pack --dry-run --json --prefix npm > /tmp/build-bouncer-npm-pack.json
          node scripts/verify-npm-pack.mjs /tmp/build-bouncer-npm-pack.json
          node --test scripts/launcher.test.mjs
