version: 1
meta:
    template:
        id: go
    inputs:
        template.id: go
checks:
    - id: template:go:bbe1a8f4b2bc
      source: template:go
      name: tests
      run: go test ./...
      requires: go
    - id: template:go:e44fa91e16d0
      source: template:go
      name: lint
      run: go vet ./...
      requires: go
    - id: ci:ci:81aa61a98427
      source: ci:ci
      name: ci:ci:race-ubuntu-latest:linux:go-test--race
      run: go test -race ./...
      shell: bash
      os: linux
      requires: go
    - id: ci:ci:4c98b7f5dc34
      source: ci:ci
      name: ci:ci:test-matrix.os:linux:go-env
      run: go env
      shell: bash
      os: linux
      requires: go
    - id: ci:ci:c4652dffdf3e
      source: ci:ci
      name: ci:ci:test-matrix.os:linux:verify-gofmt
      run: |
          set -euo pipefail
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then
            echo "gofmt needed on:"
            echo "$bad"
            exit 1
          fi
      shell: bash
      os: linux
    - id: ci:ci:27aaca99cfa1
      source: ci:ci
      name: ci:ci:test-matrix.os:linux:verify-module-checksums
      run: go mod verify
      shell: bash
      os: linux
      requires: go
    - id: ci:ci:ab8b9276ed05
      source: ci:ci
      name: ci:ci:test-matrix.os:linux:go-vet
      run: go vet ./...
      shell: bash
      os: linux
      requires: go
    - id: ci:ci:47813f61d556
      source: ci:ci
      name: ci:ci:test-matrix.os:linux:go-test
      run: go test ./...
      shell: bash
      os: linux
      requires: go
    - id: ci:ci:ec935e7aa473
      source: ci:ci
      name: ci:ci:test-matrix.os:windows:go-env
      run: go env
      shell: pwsh
      os: windows
      requires: go
